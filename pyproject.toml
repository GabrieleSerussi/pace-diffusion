[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pace-diffusion"
version = "1.0.0"
description = "PACE: phase-aware, capacity-efficient diffusion distillation (profiling, phase discovery, capacity allocation, routed students)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Eitan Kosman" },
    { name = "Gabriele Serussi" },
    { name = "Chaim Baskin" },
]
keywords = ["diffusion models", "distillation", "model compression", "EDM", "DiT"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1,<3",
    "torchvision>=0.16",
    "numpy>=1.24,<3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tqdm>=4.60",
    "pillow>=9.0",
    "pyarrow>=12.0",
    "webdataset>=0.2,<1",
]

[project.optional-dependencies]
# facebookresearch/DiT itself is not installable; clone it and set DIT_REPO.
dit = ["timm>=0.9", "diffusers>=0.25"]
eval = ["clean-fid>=0.1.35"]
audio = ["torchaudio>=2.1", "torchcodec>=0.2"]
# Interactive HTML heatmaps of large profiles.
viz = ["plotly>=5.0"]
# TensorBoard logging during U-Net student training (setuptools provides pkg_resources).
train = ["tensorboard>=2.14", "setuptools<81"]
dev = ["pytest>=7.4"]
all = [
    "pace-diffusion[dit,eval,audio,viz,train,dev]",
]

[project.urls]
Repository = "https://github.com/GabrieleSerussi/pace-diffusion"

[tool.setuptools.packages.find]
include = ["pace", "pace.*"]

[tool.setuptools.package-data]
"pace.vendor" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "external_dit: needs facebookresearch/DiT (set DIT_REPO) and timm",
    "external_edm: needs NVlabs/edm (set EDM_REPO, or use ../edm or PYTHONPATH)",
    "launcher: runs or parses the shell scripts under reproduce/ (needs bash)",
    "slow: takes tens of seconds on a laptop CPU",
]
filterwarnings = [
    "ignore::DeprecationWarning:timm.*",
]
